<style>
  :root{--navy:#241141;--purple:#3a1f63;--gold:#c9952c;--cream:#f8f6f1;--ink:#2b2440;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--cream);color:var(--ink);font-family:'Inter Tight',system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
  header{background:linear-gradient(135deg,var(--navy),var(--purple));color:#fff;text-align:center;padding:56px 20px 44px;position:relative;overflow:hidden}
  header:after{content:"";position:absolute;inset:0;background:radial-gradient(1200px 300px at 50% -40%,rgba(201,149,44,.28),transparent)}
  .kicker{letter-spacing:.32em;text-transform:uppercase;font-size:13px;font-weight:700;color:var(--gold);margin-bottom:12px;position:relative}
  h1{font-family:'Fraunces',Georgia,serif;font-size:clamp(30px,6vw,54px);line-height:1.05;position:relative}
  .sub{margin-top:14px;font-size:clamp(14px,2.4vw,18px);opacity:.9;position:relative}
  .tag{display:inline-block;margin-top:20px;border:1px solid var(--gold);color:var(--gold);border-radius:999px;padding:7px 18px;font-size:12px;letter-spacing:.18em;text-transform:uppercase;font-weight:700;position:relative}
  .grid{max-width:1200px;margin:36px auto;padding:0 16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
  .tile{display:block;border-radius:14px;overflow:hidden;background:#e9e4da;box-shadow:0 6px 20px rgba(36,17,65,.10);aspect-ratio:1/1}
  .tile img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .4s ease}
  .tile:hover img{transform:scale(1.05)}
  footer{text-align:center;padding:34px 20px 60px;color:#6b6480;font-size:14px}
  footer a{color:var(--gold);text-decoration:none;font-weight:600}
</style>
