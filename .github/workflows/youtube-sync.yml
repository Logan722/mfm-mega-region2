# Scheduled YouTube sync (owner request, Oct 16 2026).
# Every 30 minutes GitHub rebuilds the parts of the site that come from the YouTube channel and publishes them
# (Netlify deploys every push to main). It only commits when something actually changed.
#   - Media page: new uploads get a card and their own message page; the Women and Gen218 sections update
#   - Live page: Scheduled livestreams / Previous livestreams from the channel's Live tab
#   - event pages that have ended drop off (the build also refreshes date-based content)
#   - Newsletter page: an issue that has gone out on Brevo becomes the Latest Issue (tools/newsletter_hub.py)
# The pages still top themselves up in the browser between runs; this keeps the built pages current too.
#
# Saving Netlify credits (Dawn, Nov 27 2026): every publish to main is a Netlify production deploy (15 credits), and
# publishing on ANY change used ~3,000 credits a month. tools/sync_gate.py now decides:
#   now   - a new message page, videos added/removed on the home/media/women/Gen218 pages, a livestream added or
#           moved on the Live page, or a new newsletter issue  -> publish straight away (as before)
#   small - minor changes (ended events, playlist order, text refreshes) -> publish at most every 12 hours
#   none  - only dates/timestamps changed -> not published
name: YouTube sync

on:
  schedule:
    - cron: '7,37 * * * *'      # every 30 minutes (GitHub may start scheduled runs a few minutes late)
  workflow_dispatch: {}          # "Run workflow" button for an immediate sync

permissions:
  contents: write

concurrency:
  group: youtube-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 200            # enough history to find the last sync publish (12-hour rule for small changes)
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Pillow (image sizes)
        run: python -m pip install --quiet pillow
      - name: Build (includes the YouTube sync)
        run: python tools/build_site.py
      - name: Publish if anything changed
        run: |
          if [ -z "$(git status --porcelain)" ]; then echo "Nothing new on YouTube — no change."; exit 0; fi
          git status --short | head -40
          verdict=$(python tools/sync_gate.py)
          echo "Sync gate: $verdict"
          if [ "$verdict" = "none" ]; then echo "Only dates/timestamps changed — not publishing."; exit 0; fi
          if [ "$verdict" = "small" ]; then
            last=$(git log -1 --format=%ct --grep='^Auto-sync from YouTube' HEAD 2>/dev/null || true)
            now=$(date +%s)
            if [ -n "$last" ] && [ $((now - last)) -lt 43200 ]; then
              echo "Minor changes only and the last sync publish was under 12 hours ago — waiting (saves Netlify credits)."; exit 0
            fi
          fi
          git config user.name "MFM site sync"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Auto-sync from YouTube ($(date -u '+%Y-%m-%d %H:%M') UTC)"
          for i in 1 2 3; do
            git push origin HEAD:main && exit 0
            echo "main moved — rebasing and retrying ($i)"; git pull --rebase -q origin main || exit 1
          done
          exit 1
