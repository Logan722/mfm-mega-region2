# Scheduled YouTube sync (owner request, Oct 16 2026).
# Every 30 minutes GitHub rebuilds the parts of the site that come from the YouTube channel and publishes them
# (Netlify deploys every push to main). It only commits when something actually changed.
#   - Media page: new uploads get a card and their own message page; the Women and Gen218 sections update
#   - Live page: Scheduled livestreams / Previous livestreams from the channel's Live tab
#   - event pages that have ended drop off (the build also refreshes date-based content)
# The pages still top themselves up in the browser between runs; this keeps the built pages current too.
name: YouTube sync

on:
  schedule:
    - cron: '7,37 * * * *'      # every 30 minutes (GitHub may start scheduled runs a few minutes late)
  workflow_dispatch: {}          # "Run workflow" button for an immediate sync

permissions:
  contents: write

concurrency:
  group: youtube-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Pillow (image sizes)
        run: python -m pip install --quiet pillow
      - name: Build (includes the YouTube sync)
        run: python tools/build_site.py
      - name: Publish if anything changed
        run: |
          if [ -z "$(git status --porcelain)" ]; then echo "Nothing new on YouTube — no change."; exit 0; fi
          git status --short | head -40
          git config user.name "MFM site sync"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Auto-sync from YouTube ($(date -u '+%Y-%m-%d %H:%M') UTC)"
          for i in 1 2 3; do
            git push origin HEAD:main && exit 0
            echo "main moved — rebasing and retrying ($i)"; git pull --rebase -q origin main || exit 1
          done
          exit 1
