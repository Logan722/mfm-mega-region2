<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MFM Mega Region 2 — What's Happening</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..600&family=Inter+Tight:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{
  --navy:#0c1330; --navy2:#170f38; --plum:#2a1150;
  --gold:#f2b73c; --gold2:#ffd873; --fire:#ff5a1f; --magenta:#c62a9e;
  --cream:#f6efe0; --dim:#c3b6d8;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#070a1c;
  font-family:'Inter Tight',system-ui,Arial,sans-serif;color:var(--cream);}
body.idle{cursor:none}
#stage{position:fixed;inset:0;overflow:hidden}
.slide{position:absolute;inset:0;opacity:0;visibility:hidden;
  transition:opacity .9s ease, transform 1.1s ease;transform:scale(1.03);z-index:1}
.slide.active{opacity:1;visibility:visible;transform:scale(1);z-index:2}
.bg{position:absolute;inset:-6%;background-size:cover;background-position:center;
  filter:blur(30px) brightness(.48) saturate(1.4);transform:scale(1.12)}
.slide.active .bg{animation:ken 26s ease-in-out infinite alternate}
@keyframes ken{from{transform:scale(1.12) translate(0,0)}to{transform:scale(1.26) translate(-2%,-3%)}}
.scrim{position:absolute;inset:0;
  background:
   radial-gradient(120% 90% at 88% 108%, rgba(255,90,31,.42), transparent 55%),
   radial-gradient(90% 80% at 6% -10%, rgba(198,42,158,.40), transparent 55%),
   linear-gradient(115deg, rgba(10,16,44,.94) 0%, rgba(28,14,66,.80) 46%, rgba(12,18,48,.30) 100%);}
.vig{position:absolute;inset:0;box-shadow:inset 0 0 340px 60px rgba(4,6,20,.85);pointer-events:none}
#embers{position:fixed;inset:0;z-index:3;pointer-events:none}
.content.solo{grid-template-columns:1fr!important;justify-items:center}
.content{position:absolute;inset:0;z-index:4;display:grid;
  grid-template-columns:1.15fr .85fr;gap:2vw;align-items:center;
  padding:5.2vh 5vw 12vh;}
.left{max-width:60ch}
.eyebrow{display:flex;align-items:center;gap:.7em;font-weight:700;letter-spacing:.26em;
  text-transform:uppercase;font-size:clamp(.72rem,1.35vw,1.15rem);color:var(--gold2);
  text-shadow:0 0 22px rgba(242,183,60,.45)}
.eyebrow .logo{width:1.9em;height:1.9em;filter:drop-shadow(0 0 10px rgba(242,183,60,.5))}
.title{font-family:'Fraunces',Georgia,serif;font-weight:600;line-height:.94;
  font-size:clamp(3.2rem,8.4vw,8.6rem);margin:.12em 0 .06em;letter-spacing:-.01em;
  background:linear-gradient(96deg,#ffe9b0,var(--gold) 40%,var(--fire) 88%);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 6px 30px rgba(255,90,31,.35))}
.sub{font-family:'Fraunces',Georgia,serif;font-weight:600;font-style:normal;
  font-size:clamp(1.3rem,2.9vw,2.5rem);color:#fff;opacity:.96;line-height:1.05}
.theme{font-family:'Fraunces',Georgia,serif;font-style:italic;color:var(--gold2);
  font-size:clamp(1.05rem,2.05vw,1.7rem);margin-top:.5em;opacity:.95;max-width:26ch}
.rule{height:5px;width:132px;border-radius:4px;margin:1.15em 0 1.1em;
  background:linear-gradient(90deg,var(--gold),var(--fire));box-shadow:0 0 26px rgba(255,90,31,.7)}
.meta{display:flex;flex-direction:column;gap:.55em}
.meta .row{display:flex;align-items:center;gap:.62em;font-size:clamp(1rem,1.8vw,1.5rem)}
.meta .ic{width:1.5em;height:1.5em;flex:none;display:grid;place-items:center;border-radius:50%;
  background:linear-gradient(135deg,var(--gold),var(--fire));color:#1a1030;font-weight:800;font-size:.8em}
.meta .date{font-weight:700;color:#fff}
.meta .venue{color:var(--dim);font-size:clamp(.9rem,1.55vw,1.25rem)}
.countdown{display:inline-flex;align-items:center;gap:.55em;margin-top:1.5em;
  padding:.62em 1.25em;border-radius:999px;font-weight:800;letter-spacing:.06em;
  font-size:clamp(1rem,2vw,1.7rem);color:#1a1030;
  background:linear-gradient(100deg,var(--gold2),var(--gold) 55%,var(--fire));
  box-shadow:0 0 40px rgba(242,183,60,.55);animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 34px rgba(242,183,60,.45);transform:translateY(0)}
  50%{box-shadow:0 0 58px rgba(255,90,31,.7);transform:translateY(-2px)}}
.right{position:relative;height:100%;display:flex;align-items:center;justify-content:flex-end;gap:1.4vw}
.qrwrap{display:flex;flex-direction:column;align-items:center;gap:.6em;
  background:linear-gradient(180deg,#fff,#f3eee2);border-radius:20px;padding:1.05em 1.05em .85em;
  box-shadow:0 0 0 3px rgba(242,183,60,.85),0 20px 60px rgba(0,0,0,.55),0 0 70px rgba(242,183,60,.35);
  animation:floaty 6.5s ease-in-out infinite}
.qrwrap .lab{font-weight:800;letter-spacing:.16em;color:#171029;font-size:.82rem;text-transform:uppercase}
.qrwrap .qr{width:clamp(140px,12vw,210px);height:clamp(140px,12vw,210px)}
.qrwrap .qr img,.qrwrap .qr canvas{width:100%!important;height:100%!important}
.qrwrap .reg{font-weight:700;color:#7a4a12;font-size:.8rem}
.flyer{height:clamp(320px,74vh,780px);border-radius:16px;border:2px solid rgba(242,183,60,.9);
  box-shadow:0 26px 70px rgba(0,0,0,.6),0 0 60px rgba(255,90,31,.28);
  animation:floaty 7.5s ease-in-out infinite}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}

/* intro / title card */
.intro{display:grid;place-content:center;text-align:center;gap:.2em;height:100%;padding:6vh 6vw}
.intro .emblem{width:clamp(120px,15vh,190px);margin:0 auto 1rem;filter:drop-shadow(0 0 34px rgba(242,183,60,.6));
  animation:floaty 6s ease-in-out infinite}
.intro .k{font-weight:700;letter-spacing:.3em;text-transform:uppercase;color:var(--gold2);
  font-size:clamp(.8rem,1.5vw,1.2rem)}
.intro h1{font-family:'Fraunces',serif;font-weight:600;line-height:.98;margin:.25em 0;
  font-size:clamp(2.6rem,7vw,6.6rem);
  background:linear-gradient(96deg,#ffe9b0,var(--gold) 45%,var(--fire) 92%);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.intro .cities{color:#fff;opacity:.9;font-size:clamp(1rem,2vw,1.7rem);margin-top:.3em;
  font-family:'Fraunces',serif;font-style:italic}
.intro .scr{color:var(--dim);margin-top:1.4em;font-style:italic;font-family:'Fraunces',serif;
  font-size:clamp(.95rem,1.5vw,1.25rem)}

/* controls */
#bar{position:fixed;left:50%;bottom:2.4vh;transform:translateX(-50%);z-index:20;
  display:flex;align-items:center;gap:.35rem;padding:.4rem .5rem;border-radius:999px;
  background:rgba(12,14,34,.62);backdrop-filter:blur(14px);border:1px solid rgba(242,183,60,.28);
  box-shadow:0 12px 40px rgba(0,0,0,.5);transition:opacity .4s ease}
body.idle #bar{opacity:0;pointer-events:none}
#bar button{appearance:none;border:0;cursor:pointer;color:var(--cream);
  background:transparent;font:inherit;font-weight:600;font-size:.95rem;
  padding:.5rem .7rem;border-radius:999px;display:flex;align-items:center;gap:.4em;transition:background .2s}
#bar button:hover{background:rgba(242,183,60,.16)}
#bar .auto.on{background:linear-gradient(100deg,var(--gold),var(--fire));color:#1a1030}
#bar .sep{width:1px;height:22px;background:rgba(255,255,255,.16)}
#count{font-variant-numeric:tabular-nums;color:var(--dim);font-size:.85rem;padding:0 .5rem;min-width:52px;text-align:center}
#prog{position:fixed;top:0;left:0;height:4px;width:0;z-index:20;
  background:linear-gradient(90deg,var(--gold),var(--fire));box-shadow:0 0 14px rgba(255,90,31,.7);
  transition:width .2s linear;opacity:0}
#prog.on{opacity:1}
.hint{position:fixed;right:2vw;top:2.2vh;z-index:20;color:var(--dim);font-size:.8rem;
  background:rgba(12,14,34,.5);border:1px solid rgba(255,255,255,.12);padding:.4rem .7rem;border-radius:999px;
  transition:opacity .4s}
body.idle .hint{opacity:0}
@media (max-width:820px){
  .content{grid-template-columns:1fr;gap:1.2vh;padding:4vh 6vw 12vh;align-content:center}
  .right{justify-content:center;order:-1;height:auto;margin-bottom:1vh}
  .flyer{height:34vh}
  .qrwrap{position:absolute;right:-2vw;bottom:-2vh;transform:scale(.8)}
  .title{font-size:clamp(2.6rem,13vw,4rem)}
}
</style>
</head>
<body>
<div id="stage"></div>
<canvas id="embers"></canvas>
<div id="prog"></div>
<div class="hint">← →  navigate &nbsp;·&nbsp; <b>A</b> auto-play &nbsp;·&nbsp; <b>F</b> full screen</div>
<div id="bar">
  <button id="prev" title="Previous (←)">‹</button>
  <button class="auto" id="auto" title="Auto-play (A)">▶ Auto&nbsp;Off</button>
  <button id="next" title="Next (→)">›</button>
  <span class="sep"></span>
  <span id="count">1 / 1</span>
  <span class="sep"></span>
  <button id="full" title="Full screen (F)">⛶</button>
</div>

  if(!dateStr) return null;
  const ev=new Date(dateStr+'T00:00:00'); const now=new Date(); now.setHours(0,0,0,0);
  const d=Math.round((ev-now)/86400000);
  if(d<0) return null; if(d===0) return 'HAPPENING TODAY';
  if(d===1) return 'TOMORROW'; if(d<=7) return d+' DAYS TO GO';
  return d+' DAYS TO GO';
}
function fmtDate(s){ if(!s) return '';
  return new Date(s+'T00:00:00').toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'});
}

const stage=document.getElementById('stage');
const EV=getEvents();
const slides=[];

/* intro card */
(function(){
  const el=document.createElement('section'); el.className='slide';
  const cities=EV.map(e=>e.short).slice(0,6).join('  ·  ');
  el.innerHTML=`<div class="bg" style="background-image:url('${EV[0]?EV[0].flyer:''}')"></div>
    <div class="scrim"></div><div class="vig"></div>
    <div class="content solo"><div class="intro">
      <img class="emblem" src="${EMBLEM}" alt="MFM">
      <div class="k">Mountain of Fire &amp; Miracles Ministries</div>
      <h1>What's Happening<br>Across Mega Region 2</h1>
      <div class="cities">${cities}</div>
      <div class="scr">&ldquo;Come and possess your possessions.&rdquo; — Obadiah 1:17</div>
    </div></div>`;
  stage.appendChild(el); slides.push(el);
})();

/* event slides */
EV.forEach((e,i)=>{
  const el=document.createElement('section'); el.className='slide';
  const cd=daysTo(e.date);
  const timeTxt=e.time?('  ·  '+e.time):'';
  el.innerHTML=`
    <div class="bg" style="background-image:url('${e.flyer}')"></div>
    <div class="scrim"></div><div class="vig"></div>
    <div class="content">
      <div class="left">
        <div class="eyebrow"><img class="logo" src="${EMBLEM}">Mega Region 2 · ${e.cat}</div>
        <div class="title">${e.short}</div>
        ${/crusade/i.test(e.cat)?'<div class="sub">Deliverance Crusade</div>':''}
        ${e.theme?`<div class="theme">&ldquo;${e.theme}&rdquo;</div>`:''}
        <div class="rule"></div>
        <div class="meta">
          <div class="row"><span class="ic">▦</span><span class="date">${e.dateDisplay||fmtDate(e.date)}${timeTxt}</span></div>
          <div class="row"><span class="ic">◎</span><span class="venue">${e.venue}</span></div>
        </div>
        ${cd?`<div class="countdown">✦ ${cd}</div>`:''}
      </div>
      <div class="right">
        <div class="qrwrap no-advance">
          <div class="lab">Scan to Register</div>
          <div class="qr" data-reg="${e.reg}"></div>
          <a class="reg" href="${e.reg}" target="_blank" rel="noopener">${e.regLabel}</a>
        </div>
        <img class="flyer" src="${e.flyer}" alt="${e.short}">
      </div>
    </div>`;
  stage.appendChild(el); slides.push(el);
});

/* build QRs */
document.querySelectorAll('.qr').forEach(q=>{
  try{ new QRCode(q,{text:q.dataset.reg,width:220,height:220,
    colorDark:'#0c1330',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M}); }catch(e){}
});

/* ---- navigation ---- */
let cur=0, auto=false, timer=null, progRAF=null, progStart=0;
const countEl=document.getElementById('count'), prog=document.getElementById('prog'),
      autoBtn=document.getElementById('auto');
function show(i){
  cur=(i+slides.length)%slides.length;
  slides.forEach((s,k)=>s.classList.toggle('active',k===cur));
  countEl.textContent=(cur+1)+' / '+slides.length;
  if(auto) restartTimer();
}
function next(){ show(cur+1); }
function prev(){ show(cur-1); }
function restartTimer(){
  clearTimeout(timer); timer=setTimeout(next,AUTO_MS);
  prog.classList.add('on'); progStart=performance.now();
  cancelAnimationFrame(progRAF); tickProg();
}
function tickProg(){
  const p=Math.min(1,(performance.now()-progStart)/AUTO_MS);
  prog.style.width=(p*100)+'%';
  if(auto&&p<1) progRAF=requestAnimationFrame(tickProg);
}
function setAuto(on){
  auto=on; autoBtn.classList.toggle('on',on);
  autoBtn.innerHTML = on?'❚❚ Auto&nbsp;On':'▶ Auto&nbsp;Off';
  if(on){ restartTimer(); }
  else{ clearTimeout(timer); cancelAnimationFrame(progRAF); prog.classList.remove('on'); prog.style.width='0'; }
}
document.getElementById('next').onclick=e=>{e.stopPropagation();next();};
document.getElementById('prev').onclick=e=>{e.stopPropagation();prev();};
autoBtn.onclick=e=>{e.stopPropagation();setAuto(!auto);};
document.getElementById('full').onclick=e=>{e.stopPropagation();
  if(!document.fullscreenElement) document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen();
  else document.exitFullscreen&&document.exitFullscreen();};
stage.addEventListener('click',e=>{ if(e.target.closest('.no-advance,#bar')) return; next(); });
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();next();}
  else if(e.key==='ArrowLeft'){e.preventDefault();prev();}
  else if(e.key.toLowerCase()==='a'){setAuto(!auto);}
  else if(e.key.toLowerCase()==='f'){document.getElementById('full').click();}
});

/* idle hide */
let idleT; function wake(){ document.body.classList.remove('idle'); clearTimeout(idleT);
  idleT=setTimeout(()=>document.body.classList.add('idle'),3200); }
['mousemove','touchstart','keydown'].forEach(ev=>document.addEventListener(ev,wake));
wake();

/* ---- embers ---- */
const cv=document.getElementById('embers'), cx=cv.getContext('2d'); let W,H,parts;
function rs(){ W=cv.width=innerWidth; H=cv.height=innerHeight;
  parts=Array.from({length:Math.round(W/22)},()=>mk()); }
function mk(){ return {x:Math.random()*W,y:H+Math.random()*H,r:Math.random()*2.2+.6,
  s:Math.random()*.5+.18,d:Math.random()*.6-.3,a:Math.random()*.5+.3,
  c:Math.random()<.5?'242,183,60':'255,90,31',t:Math.random()*6}; }
function loop(){ cx.clearRect(0,0,W,H);
  parts.forEach(p=>{ p.y-=p.s; p.x+=Math.sin(p.t+=0.01)*.3+p.d*.2;
    if(p.y<-10){Object.assign(p,mk(),{y:H+10});}
    const fl=p.a*(0.6+0.4*Math.sin(p.t*3));
    cx.beginPath();cx.arc(p.x,p.y,p.r,0,7);cx.fillStyle='rgba('+p.c+','+fl+')';
    cx.shadowBlur=10;cx.shadowColor='rgba('+p.c+',.9)';cx.fill();cx.shadowBlur=0;});
  requestAnimationFrame(loop); }
addEventListener('resize',rs); rs(); loop();

show(0);
</script>
</body>
</html>
