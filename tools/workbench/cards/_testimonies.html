<!DOCTYPE html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500;1,9..144,600&family=Inter+Tight:wght@500;600;700&display=block" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
html,body{width:1200px;height:630px;overflow:hidden}
body{background:#0e1a33;font-family:'Inter Tight',sans-serif;color:#fff;position:relative}
.bg{position:absolute;inset:0;background:radial-gradient(ellipse 60% 85% at 50% -10%,rgba(232,186,90,.30),transparent 62%),radial-gradient(ellipse 50% 60% at 50% 120%,rgba(232,93,38,.22),transparent 70%),linear-gradient(180deg,#172848 0%,#101d38 55%,#0b1529 100%)}
.shaft{position:absolute;left:50%;top:-140px;width:520px;height:900px;transform:translateX(-50%) rotate(0deg);background:linear-gradient(180deg,rgba(255,226,160,.16),rgba(255,226,160,0) 70%);clip-path:polygon(38% 0,62% 0,100% 100%,0 100%);filter:blur(8px)}
.grain{position:absolute;inset:0;background:url(grain.png);opacity:.10;mix-blend-mode:overlay}
.frame{position:absolute;inset:22px;border:1px solid rgba(240,199,96,.28)}
.wrap{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 90px 70px}
.icon{width:118px;height:118px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle,#1d2f55 0%,#142240 70%);box-shadow:0 0 0 10px rgba(240,199,96,.10),0 0 60px rgba(240,180,80,.35);margin-bottom:26px}
.icon svg{width:76px;height:76px}
.k{font:700 17px/1 'Inter Tight',sans-serif;letter-spacing:.24em;text-transform:uppercase;color:#f0c760;margin-bottom:18px;display:flex;align-items:center;gap:14px}
.k:before,.k:after{content:"";width:34px;height:1.5px;background:currentColor;opacity:.8}
h1{font-family:Fraunces,Georgia,serif;font-weight:600;font-size:96px;line-height:1;letter-spacing:-.02em;font-variation-settings:'opsz' 144}
h1 em{font-style:italic;color:#f0c760;font-weight:500}
.sub{margin-top:20px;font:500 28px/1.35 'Inter Tight',sans-serif;color:#d6deea;max-width:900px}
.chips{display:flex;gap:12px;margin-top:26px;flex-wrap:wrap;justify-content:center}
.chips span{font:600 19px/1 'Inter Tight',sans-serif;color:#142240;background:#f0c760;border-radius:100px;padding:11px 20px}
.chips span.o{background:transparent;color:#f6e7c1;border:1.5px solid rgba(240,199,96,.55)}
.verse{margin-top:24px;font:italic 500 23px/1.4 Fraunces,Georgia,serif;color:#e9d9b4;max-width:880px}
.verse b{display:block;font:700 14px/1 'Inter Tight',sans-serif;letter-spacing:.2em;text-transform:uppercase;color:#f0c760;margin-top:10px;font-style:normal}
.foot{position:absolute;z-index:2;left:0;right:0;bottom:44px;display:flex;align-items:center;justify-content:center;gap:12px;font:600 18px/1 'Inter Tight',sans-serif;color:#aebbd0;letter-spacing:.02em}
.foot img{width:34px;height:34px;object-fit:contain}
.bar{position:absolute;left:0;right:0;bottom:0;height:8px;background:linear-gradient(90deg,#c9952c,#e85d26,#c9952c)}
</style></head><body><div class="bg"></div><div class="shaft"></div><div class="grain"></div><div class="frame"></div>
<div class="wrap" id="w"></div><div class="foot"><img src="logo.png" alt="">mfmmegaregion2usa.org</div><div class="bar"></div>
<script>
var C={"icon":"<svg viewBox=\"0 0 64 64\"><path d=\"M14 40c0-10 5-17 15-21l2 4c-5 2.6-7.6 6-8 10h7v14H14Zm22 0c0-10 5-17 15-21l2 4c-5 2.6-7.6 6-8 10h7v14H36Z\" fill=\"#f0c760\"/></svg>","k":"Testimonies","h":"God is still <em>doing it.</em>","sub":"Read what God has done, and share your own testimony.","verse":["The LORD hath done great things for us; whereof we are glad.","Psalm 126:3"]};var w=document.getElementById('w');
w.innerHTML=(C.icon?'<div class="icon">'+C.icon+'</div>':'')+'<div class="k">'+C.k+'</div><h1>'+C.h+'</h1>'+(C.sub?'<p class="sub">'+C.sub+'</p>':'')+(C.chips?'<div class="chips">'+C.chips.map(function(c,i){return '<span class="'+(i?'o':'')+'">'+c+'</span>'}).join('')+'</div>':'')+(C.verse?'<p class="verse">“'+C.verse[0]+'”<b>'+C.verse[1]+'</b></p>':'');
if(C.h1)document.querySelector('h1').style.fontSize=C.h1+'px';
</script></body></html>
